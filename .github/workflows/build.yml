name: Build Brucey S3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Show repo layout
        run: |
          echo "=== repo root ==="
          ls -la
          echo "=== firmware/ ==="
          ls -la firmware/ || echo "NO firmware DIR"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U platformio esptool

      - name: Extract firmware
        run: |
          ZIP="firmware/ESP-HACKBRUCEYS3v24.3.zip"
          if [ ! -f "$ZIP" ]; then
            echo "!! expected zip missing, falling back to first zip found"
            ZIP=$(ls firmware/*.zip | head -n1)
          fi
          echo "Using zip: $ZIP"
          unzip -l "$ZIP" | head -n 40
          mkdir -p src
          unzip -o "$ZIP" -d src
          echo "=== extracted tree ==="
          find src -maxdepth 3 | head -n 80

      - name: Find project and list environments
        run: |
          INI=$(find src -name platformio.ini | head -n1)
          if [ -z "$INI" ]; then echo "!! no platformio.ini found"; exit 1; fi
          PROJ=$(dirname "$INI")
          echo "PROJ=$PROJ" >> $GITHUB_ENV
          echo "Project dir: $PROJ"
          cd "$PROJ"
          echo "=== environments in platformio.ini ==="
          grep -nE '^\[env:' platformio.ini || echo "(no [env:] sections found)"
          echo "=== full platformio.ini ==="
          cat platformio.ini

      - name: Repair missing or mis-cased headers
        run: |
          cd "$PROJ"
          echo "=== FULL PROJECT TREE (excluding .pio) ==="
          find . -type f -not -path './.pio/*' | sort
          echo
          echo "=== SCANNING INCLUDES ==="
          grep -rhoE '#include[[:space:]]+"[^"]+"' src \
            | sed -E 's/.*"(.*)"/\1/' | sort -u > /tmp/incs.txt || true
          while read -r inc; do
            if [ -z "$inc" ]; then continue; fi
            if [ -f "src/$inc" ]; then continue; fi
            base=$(basename "$inc")
            hit=$(find . -type f -not -path './.pio/*' -iname "$base" | head -n1)
            if [ -n "$hit" ]; then
              echo "FIXED: $inc   <-   $hit"
              mkdir -p "src/$(dirname "$inc")"
              cp "$hit" "src/$inc"
            else
              echo "NOT FOUND ANYWHERE: $inc"
            fi
          done < /tmp/incs.txt
          
           - name: Configure for N16R8 hardware
              run: |
          cd "$PROJ"
          if grep -q '^\[env:BRUCEY_S3_SSD1306\]' platformio.ini; then
            sed -i 's|^\[env:BRUCEY_S3_SSD1306\]|&\nboard_build.flash_size = 16MB\nboard_upload.flash_size = 16MB\nboard_build.arduino.memory_type = qio_opi|' platformio.ini
            echo "=== platformio.ini after patch ==="
            cat platformio.ini
          else
            echo "!! env section not found, skipping patch"
          fi

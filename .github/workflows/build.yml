name: Build Brucey S3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Show repo layout
        run: |
          echo "=== repo root ==="
          ls -la
          echo "=== firmware/ ==="
          ls -la firmware/ || echo "NO firmware DIR"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U platformio esptool

      - name: Extract firmware
        run: |
          ZIP="firmware/ESP-HACKBRUCEYS3v24.3.zip"
          if [ ! -f "$ZIP" ]; then
            echo "!! expected zip missing, falling back to first zip found"
            ZIP=$(ls firmware/*.zip | head -n1)
          fi
          echo "Using zip: $ZIP"
          unzip -l "$ZIP" | head -n 40
          mkdir -p src
          unzip -o "$ZIP" -d src
          echo "=== extracted tree ==="
          find src -maxdepth 3 | head -n 80

      - name: Find project and list environments
        run: |
          INI=$(find src -name platformio.ini | head -n1)
          if [ -z "$INI" ]; then echo "!! no platformio.ini found"; exit 1; fi
          PROJ=$(dirname "$INI")
          echo "PROJ=$PROJ" >> $GITHUB_ENV
          echo "Project dir: $PROJ"
          cd "$PROJ"
          echo "=== environments in platformio.ini ==="
          grep -nE '^\[env:' platformio.ini || echo "(no [env:] sections found)"
          echo "=== full platformio.ini ==="
          cat platformio.ini

      - name: Repair missing or mis-cased headers
        run: |
          cd "$PROJ"
          echo "=== FULL PROJECT TREE (excluding .pio) ==="
          find . -type f -not -path './.pio/*' | sort
          echo
          echo "=== SCANNING INCLUDES ==="
          grep -rhoE '#include[[:space:]]+"[^"]+"' src \
            | sed -E 's/.*"(.*)"/\1/' | sort -u > /tmp/incs.txt || true
          while read -r inc; do
            if [ -z "$inc" ]; then continue; fi
            if [ -f "src/$inc" ]; then continue; fi
            base=$(basename "$inc")
            hit=$(find . -type f -not -path './.pio/*' -iname "$base" | head -n1)
            if [ -n "$hit" ]; then
              echo "FIXED: $inc   <-   $hit"
              mkdir -p "src/$(dirname "$inc")"
              cp "$hit" "src/$inc"
            else
              echo "NOT FOUND ANYWHERE: $inc"
            fi
          done < /tmp/incs.txt

      - name: Configure for N16R8 hardware
        run: |
          cd "$PROJ"
          if grep -q '^\[env:BRUCEY_S3_SSD1306\]' platformio.ini; then
            sed -i '/^\[env:BRUCEY_S3_SSD1306\]/a\
board_build.flash_size = 16MB\
board_upload.flash_size = 16MB\
board_build.arduino.memory_type = qio_opi' platformio.ini
            echo "=== platformio.ini after patch ==="
            cat platformio.ini
          else
            echo "!! env section not found, skipping patch"
          fi

      - name: Build
        run: |
          cd "$PROJ"
          pio run -e BRUCEY_S3_SSD1306

      - name: Collect build files
        if: always()
        run: |
          mkdir -p out
          B="${PROJ:-src}/.pio/build/BRUCEY_S3_SSD1306"
          echo "build dir: $B"
          ls -la "$B" || true
          cp "$B"/*.bin out/ 2>/dev/null || true
          cp "$B"/firmware.elf "$B"/firmware.map out/ 2>/dev/null || true
          if command -v esptool.py >/dev/null; then E="esptool.py"; else E="esptool"; fi
          $E --chip esp32s3 merge_bin -o out/brucey-s3-merged.bin \
            --flash_mode dio --flash_freq 80m --flash_size 16MB \
            0x0 "$B"/bootloader.bin 0x8000 "$B"/partitions.bin \
            0xe000 "$B"/boot_app0.bin 0x10000 "$B"/firmware.bin || true
          ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brucey-s3-firmware
          path: out/
          if-no-files-found: warn

name: Build Brucey S3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Show repo layout
        run: |
          ls -la
          ls -la firmware/ || echo "NO firmware DIR"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U platformio esptool

      - name: Extract firmware
        run: |
          ZIP="firmware/ESP-HACKBRUCEYS3v24.3.zip"
          if [ ! -f "$ZIP" ]; then ZIP=$(ls firmware/*.zip | head -n1); fi
          echo "Using zip: $ZIP"
          mkdir -p src
          unzip -o "$ZIP" -d src

      - name: Find project and list environments
        run: |
          INI=$(find src -name platformio.ini | head -n1)
          if [ -z "$INI" ]; then echo "!! no platformio.ini"; exit 1; fi
          PROJ=$(dirname "$INI")
          echo "PROJ=$PROJ" >> $GITHUB_ENV
          echo "Project dir: $PROJ"
          cd "$PROJ"
          grep -nE '^\[env:' platformio.ini || echo "(no env sections)"
          cat platformio.ini

      - name: Repair missing or mis-cased headers
        run: |
          cd "$PROJ"
          find . -type f -not -path './.pio/*' | sort
          grep -rhoE '#include[[:space:]]+"[^"]+"' src | sed -E 's/.*"(.*)"/\1/' | sort -u > /tmp/incs.txt
          while read -r inc; do
            if [ -z "$inc" ]; then continue; fi
            if [ -f "src/$inc" ]; then continue; fi
            base=$(basename "$inc")
            hit=$(find . -type f -not -path './.pio/*' -iname "$base" | head -n1)
            if [ -n "$hit" ]; then
              echo "FIXED: $inc <- $hit"
              mkdir -p "src/$(dirname "$inc")"
              cp "$hit" "src/$inc"
            else
              echo "NOT FOUND: $inc"
            fi
          done < /tmp/incs.txt
          echo "--- repair complete ---"

      - name: Configure for N16R8 hardware
        run: |
          cd "$PROJ"
          for pair in "board_build.flash_size=16MB" "board_upload.flash_size=16MB" "board_build.arduino.memory_type=qio_opi"; do
            key="${pair%%=*}"
            val="${pair#*=}"
            if grep -qE "^[[:space:]]*${key}[[:space:]]*=" platformio.ini; then
              echo "SKIP (already present): $key"
            else
              sed -i "s|^\[env:BRUCEY_S3_SSD1306\]|&\n${key} = ${val}|" platformio.ini
              echo "ADDED: $key = $val"
            fi
          done
          echo "=== FINAL platformio.ini ==="
          cat platformio.ini

      - name: Build
        run: |
          cd "$PROJ"
          pio run -e BRUCEY_S3_SSD1306

      - name: Collect build files
        if: always()
        run: |
          mkdir -p out
          B="${PROJ:-src}/.pio/build/BRUCEY_S3_SSD1306"
          ls -la "$B" || true
          cp "$B"/*.bin out/ 2>/dev/null || true
          cp "$B"/firmware.elf "$B"/firmware.map out/ 2>/dev/null || true
          if command -v esptool.py >/dev/null; then E="esptool.py"; else E="esptool"; fi
          $E --chip esp32s3 merge_bin -o out/brucey-s3-merged.bin --flash_mode dio --flash_freq 80m --flash_size 16MB 0x0 "$B"/bootloader.bin 0x8000 "$B"/partitions.bin 0xe000 "$B"/boot_app0.bin 0x10000 "$B"/firmware.bin || true
          ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brucey-s3-firmware
          path: out/
          if-no-files-found: warn
